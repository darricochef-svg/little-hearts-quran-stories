name: Project quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Validate Arabic voice profiles
        run: npm run voices:validate
      - name: Validate bilingual subtitle structure and timing
        run: npm run subtitles:validate
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in tools/*.mjs; do
            node --check "$file"
          done
